[project]
name = "agenticai-purchaseorder-resolution"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "despoileralert", email = "euleong@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6.0",
    "langchain-fireworks>=0.1.3",
    "langchain>=1.0.0",
    "langchain[groq]>=1.0.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
    "fastapi>=0.100.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "boto3>=1.43.87",
    "boto3-stubs~=1.43.87",
    "streamlit>=1.63.0",
    "langchain-groq>=1.1.3",
    "langchain-aws>=1.7.4",
    "ipython>=9.17.1",
    "langchain-openai>=1.6.0",
    "pyyaml>=6.0.3",
    "deepagents>=0.7.13",
    "reportlab>=5.0.1",
]

[package.optional-dependencies]
agentcore = [
    { name = "bedrock-agentcore" },
    { name = "bedrock-agentcore-starter-toolkit" },
]
aws = [
    { name = "boto3" },
    { name = "langchain-aws" },
]
takehome = [
    { name = "claude-agent-sdk" },
    { name = "deepagents" },
    { name = "pymupdf" },
    { name = "pypdf" },
    { name = "reportlab" },
]

[project.scripts]
agenticai-purchaseorder-resolution = "agenticai_purchaseorder_resolution:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
